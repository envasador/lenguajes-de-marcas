site_name: Lenguajes de Marcas — Apuntes
site_description: Apuntes y proyectos del módulo Lenguajes de Marcas y Sistemas de Gestión de la Información (DAW)
site_author: Alejandro Carmona Martos — IES Rafael Alberti
# site_url: https://<tu-usuario>.github.io/<tu-repo>/   # descomenta y ajusta antes de publicar
repo_url: https://github.com/envasador/lenguajes-de-marcas
repo_name: envasador/lenguajes-de-marcas
edit_uri: edit/main/docs/

theme:
  name: material
  language: es
  logo: assets/sello-rafael-alberti-imago-blanco.svg
  favicon: assets/sello-rafael-alberti-imago-blanco.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Cambiar a modo claro
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - header.autohide
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheet/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - footnotes
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

plugins:
  - search:
      lang: es

nav:
  - Inicio: index.md
  - Apuntes:
      - 1. Introducción a los lenguajes de marcas: apuntes/introduccion-lenguajes-marcas.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/envasador/lenguajes-de-marcas
      name: Repositorio del módulo

copyright: Contenido generado por Alejandro Carmona Martos — IES Rafael Alberti · CC BY-SA 4.0
